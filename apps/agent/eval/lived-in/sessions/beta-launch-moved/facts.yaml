    gold: ['task:Siapkan press kit beta']
    search: { queries: ['press kit', 'press kit beta'] }
  - replyContains: ['kreator podcast', 'landing page']
    gold: ['task:Kirim brief ke kreator podcast', 'task:Update harga di landing page']

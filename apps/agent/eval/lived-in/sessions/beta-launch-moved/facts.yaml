# to 20 October (Minutes in #general and a Decision in #marketing, 26 August). Then who owns the press kit, and what is overdue in
# #marketing, where two tasks are late. Lived-in exam, #252.
corpus: lived-in
language: en
area: recall
clock: 2026-10-14T02:00:00Z   # Wednesday 14 October 2026, 09:00 Asia/Jakarta
mustCover:
  - 'The public beta is no longer on 1 September: on 26 August 2026 it was moved to Tuesday 20 October 2026'
  - 'The 1 September date came from the beta launch plan Minutes of 22 July 2026 in #marketing; it moved because the Bluetooth bug and offline sync were not ready'

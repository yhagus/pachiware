  - 'Overdue in #marketing: "Kirim brief ke kreator podcast" (Sekar, due 9 October 2026) and "Update harga di landing page" (Mira, due 12 October 2026)'
turns:
  - replyContains: ['October']
    gold: [['#marketing/decisions/2026-08-26-beta-mundur-ke-20-oktober.md', '#general/minutes/2026-08-26-go-no-go-beta-publik.md', '#general/daily-logs/2026-08/2026-08-26.md'], ['#marketing/minutes/2026-07-22-rencana-peluncuran-beta.md', '#marketing/daily-logs/2026-07/2026-07-22.md']]
    search: { queries: ['public beta launch date', 'tanggal rilis beta publik', 'beta mundur'] }

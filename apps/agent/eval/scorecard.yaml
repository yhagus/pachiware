# The Rapor's exam (spec #226). Any change here, to a weight, a brief or a holdout, bumps `version`; only reports at one version compare.
# Weights are out of 100; the other 10 of the harness review's rubric, the eval itself, is met by how the run is made, not by briefs.
# `holdout` names briefs among `briefs` that never tune workspace/vocabulary.ts, the persona, a tool description or a playbook (README.md).
# Version 2 (#239): 30 briefs, 22 of them in Indonesian, the language the tenants' teams speak. The other briefs under assistant/ keep their
# dry runs and recordings and still run live, but the Rapor does not count them.
# Two briefs measure work the next spec builds: notulen-jadi-tugas (Tasks from Minutes) and colek-h-1 (a Nudge that follows the due date).
# Today a model passes them only by doing that work by hand: reading the Minutes and filing Tasks, or setting and moving a Reminder.
# Version 3: the same briefs and weights; two grading defects the first live run showed are fixed, minutes-as-document (it asked for
# a file name, which server-rendered citations never show) and notulen-pemilik-tenggat (it asked for one of two valid sources).
version: 3
weights:
  capture: 20
  recall: 25
  tasks: 20
  group: 10
  loop: 15
briefs:
  # capture
  - daily-log-from-talk
  - minutes-from-talk
  - minutes-as-document
  - pdf-ditanya-kemudian
  - notulen-pemilik-tenggat
  # recall
  - recall-asked-in-indonesian
  - recall-done-pull-request
  - recall-decision-replaced
  - private-channel-dm
  - nothing-found
  - holdout-parafrasa-volume
  - sudah-diimplementasi-pr-ditutup
  - keputusan-bertentangan
  - channel-tanpa-daily-log
  # tasks
  - cancel-with-reason
  - task-casual-indonesian
  - assign-ambiguous-name
  - bulk-cancel
  - notulen-jadi-tugas
  - telat-per-orang
  - pengingat-berulang
  - colek-h-1
  # group
  - member-joins-thread
  - dua-orang-bersamaan
  - balasan-untuk-orang-lain
  - makasih-reaksi
  # loop
  - remember-forget
  - tiga-alat-sekaligus
  - tanpa-link-karangan
  - tempel-teks-panjang
holdout:
  - notulen-pemilik-tenggat
  - holdout-parafrasa-volume
  - keputusan-bertentangan
  - telat-per-orang
  - makasih-reaksi
  - tiga-alat-sekaligus

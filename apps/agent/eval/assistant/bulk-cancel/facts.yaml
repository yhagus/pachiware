# A bulk cancel: four tasks would change at once, so the bot lists them as task lines and waits for a yes, changing nothing; the yes cancels all four. Issue #137.
language: en
clock: 2026-10-14T02:00:00Z   # Wednesday 14 October 2026, 09:00 Asia/Jakarta
seed:
  tasks:
    - { title: Draft the sponsor email, status: pending, dueAt: "2026-10-16", assignedTo: Bob }
    - { title: Book the photographer, status: pending, dueAt: "2026-10-19", assignedTo: Bob }
    - { title: Print the badges, status: pending, assignedTo: Bob }
    - { title: Order the banners, status: in_progress, assignedTo: Bob }
    - { title: Confirm the venue, status: pending, dueAt: "2026-10-15", assignedTo: Alice }
mustCover:
  - Four of Bob's tasks would be cancelled, listed before anything changed
  - All four of Bob's tasks are cancelled; Confirm the venue, Alice's, is still pending
turns:
  - ambiguous: four tasks would be cancelled at once, more than three; the bot must list them as task lines and ask for a yes, changing nothing.
    tasks:
      - { title: sponsor, status: pending }
      - { title: photographer, status: pending }
      - { title: badges, status: pending }
      - { title: banners, status: in_progress }
      - { title: venue, status: pending }
    taskList: true
    replyContains: [sponsor, photographer, badges, banners]
    replyLacks: [venue]
  - tasks:
      - { title: sponsor, status: cancelled }
      - { title: photographer, status: cancelled }
      - { title: badges, status: cancelled }
      - { title: banners, status: cancelled }
      - { title: venue, status: pending, assignedTo: Alice }

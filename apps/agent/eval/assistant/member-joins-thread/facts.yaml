# Bob joins Alice's thread: the task he asks for is his and filed as his, and in a burst where he and Alice post at once,
# the bot answers his line and leaves hers, aimed at him, alone. Spec #226, ticket #236.
language: id
area: group
clock: 2026-10-14T02:00:00Z   # Wednesday 14 October 2026, 09:00 Asia/Jakarta
mustCover:
  - Pesan katering untuk gathering tercatat sebagai tugas, jatuh tempo Jumat 16 Oktober 2026
  - Cetak name tag peserta tercatat sebagai tugas Bob
  - Name tag dicetak 60 buah, dicatat pada tugas cetak name tag
turns:
  - tasks:
      - { title: katering, dueAt: "2026-10-16", createdByName: Alice }
  - tasks:
      - { title: katering, createdByName: Alice }
      - { title: name tag, assignedTo: Bob, createdByName: Bob }
  - tasks:
      - { title: katering, notes: [] }
      - { title: name tag, assignedTo: Bob, notes: [60 buah] }

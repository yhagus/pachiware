services:
  postgres:
    image: postgres:18-alpine
    container_name: pachiware-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pachiware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pachiware_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pachiware_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pachiware} -d ${POSTGRES_DB:-pachiware_agent}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pachiware-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Optional, with `--profile mongo`: a single-node replica set, since transactions need one.
  # Connect with mongodb://localhost:27017/pachiware?replicaSet=rs0&directConnection=true
  mongo:
    image: mongo:8.0
    container_name: pachiware-mongo
    restart: unless-stopped
    profiles: ["mongo"]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once this node is primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  mongodata:
    driver: local

name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0 # matches bun-types in package.json

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test suite (SQLite)
        run: bun run test

      # Starts the compose postgres, mongo (single-node replica set) and mongo-standalone services, creates the
      # pachiware_test databases, and runs the db, CLI and agent start-up engine tests with every TEST_*_URL set.
      - name: Engine tests (SQLite, PostgreSQL, MongoDB)
        run: bun run test:engines
